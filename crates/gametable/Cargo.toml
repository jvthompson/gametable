[package]
name = "gametable"
description = "GameTable client: a tabletop card game sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gametable-core = { path = "../gametable-core" }
base64 = "0.23.1"
libloading = "0.9.1"
# SDL3, SDL_image and SDL_ttf (with its own FreeType and HarfBuzz) are built from source and linked
# statically, so the executable needs no SDL libraries beside it on any platform.
sdl3 = { version = "0.22.1", features = ["build-from-source-static", "image", "ttf"] }
sha2 = "0.11.1"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
